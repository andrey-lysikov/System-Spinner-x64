name: Rebuild

# Replaces the exe attached to a release with one built from the current state of the branch.
# Started by hand only: the version, the tag and the description of the release stay as they are —
# the only thing that changes is the file itself, and the link to the list of commits, which is
# pointed at what was actually built.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to rebuild. Empty means the newest release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the description of the release links to the commits, and that link
          # is rewritten below.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Find the release
        id: target
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.event.inputs.tag }}'.Trim()
          if (-not $tag) { $tag = gh release view --json tagName --jq '.tagName' }
          if ($LASTEXITCODE -ne 0 -or -not $tag) { throw 'No release to rebuild.' }

          Write-Host "Rebuilding the exe of $tag from $($env:GITHUB_SHA)"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        # The same script a developer runs: tests first, then the single-file exe in build.
        run: ./build.ps1

      - name: Replace the exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ steps.target.outputs.tag }} 'build/System-Spinner.exe' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'The exe was not uploaded.' }

      - name: Point the list of commits at what was built
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.target.outputs.tag }}'
          $sha = '${{ github.sha }}'

          # Only the one line with the link is touched. Everything the release says about the
          # version itself was written by hand and is left alone.
          # gh hands the description back line by line, so it is joined and split once more:
          # the lines then carry no stray carriage returns.
          $body = (gh release view $tag --json body --jq '.body') -join "`n"
          $lines = $body -split "`r?`n"
          $changed = $false

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -notmatch 'Full list of changes') { continue }

            $line = [regex]::Replace($lines[$i], '(/compare/[^\s/]+\.\.\.)\S+', ('${1}' + $sha))
            $line = [regex]::Replace($line, '(/commits/)\S+', ('${1}' + $sha))

            if ($line -ne $lines[$i]) { $lines[$i] = $line; $changed = $true }
          }

          if (-not $changed) {
            Write-Host 'No link to the commits in the description — it is left as it is.'
            "## Rebuilt`n`nThe exe of $tag was replaced with a build of $sha." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          Set-Content -Path 'release-notes.md' -Value ($lines -join "`n") -Encoding utf8
          gh release edit $tag --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'The description was not updated.' }

          "## Rebuilt`n`nThe exe of $tag was replaced with a build of $sha, and the list of commits now ends there." >> $env:GITHUB_STEP_SUMMARY
