[General]
# Language: Auto, En, Ru, Ar, Zh, Fr, De, It or Ja.
Language = Auto

# Sensor poll interval, seconds, at least 1.
UpdateInterval = 1

# Spin the tray icon outside full-screen apps.
SpinOnDesktop = true

# Verbose log: every step, not only events and errors.
Debug = false

# Own OSD for the volume and brightness keys.
AlwaysUseCustomOsd = false

# Key presses from zero to full volume or brightness; with Alt a press moves 1 %.
AdjustmentStepsOsd = 16

# Brightness and speakers of an external monitor over DDC/CI.
ControlExternalBrightness = true
ControlExternalVolume = true

# Brightness keys for a keyboard that has none.
BrightnessKeys = Ctrl+F1/F2

# External IP in the status window, asked from checkip.dyndns.org.
ShowExternalAddress = true

# Status window: chart points and process rows.
DetailHistoryPoints = 500
DetailTopProcesses = 12

[Hardware]
# GPU to watch when there are several; 0 is the discrete one.
GpuIndex = 0

# Sensor names for each value; the first one found is used.
CpuLoad = CPU Total
CpuTemp = CPU Package, Core Max, CPU Cores, P-Core Max, Core (Tctl/Tdie), Core (Tctl), Core (Tdie), CCDs Max (Tdie), CCD1 (Tdie), Package
CpuPower = CPU Package, CPU Cores, Package, Core (SVI2 TFN), CPU SoC
MemoryUsed = Memory Used
MemoryAvailable = Memory Available
GpuLoad = GPU Core, D3D 3D
GpuTemp = GPU Core, GPU Hot Spot, GPU Temperature
GpuPower = GPU Package, GPU Power, GPU PPT
GpuClock = GPU Core, GPU Graphics
GpuMemory = D3D Dedicated Memory Used, GPU Memory Used, GPU Memory Dedicated Used
GpuMemoryTotal = GPU Memory Total, D3D Dedicated Memory Total

# CPU clock: the average of the cores whose sensor name contains this.
CpuClockCores = P-Core

# Fan sensors, found on the first run; clear all three to scan again.
CpuFan = 
AioFan = 
GpuFan = 

# Extra fans: one cell each where ExtraFans stands in a panel row.
ExtraFan = 

# Average every fan in the list instead of taking the first found.
AverageCpuFan = false
AverageAioFan = false
AverageGpuFan = true

# Warning highlight thresholds; 0 turns one off.
WarnColor = #FF6A52
WarnCpuTemp = 85
WarnGpuTemp = 83
WarnSysMem = 90 %
WarnGpuMem = 90 %
WarnSwapMem = 90 %
WarnCpuUsage = 95 %
WarnGpuUsage = 95 %

# What tints the lighting towards WarnColor: Off, Heat (temperatures),
# Load (usage) or Max (whichever is nearer its threshold).
WarnColorBy = Heat

[FullScreenOverlay]
# The panel over full-screen games.
Enable = true

# Font: the first installed one from the list.
FontFamily = Impact, Haettenschweiler, Arial Narrow, Arial

# Font size, % of the automatic one, 50 to 300.
FontScalePercent = 100

# Unit labels, % of the values.
UnitSizePercent = 55

# Offset from the top-left corner of the screen, pixels.
Margin = 10

# Text colour, #RRGGBB or a name, and its opacity.
TextColor = #FFFFFF
TextOpacity = 0.85

# Backdrop behind the panel: on or off, colour, opacity.
ShowPanel = false
PanelColor = #0B0D12
PanelOpacity = 0.45

# Text shadow: blur 0 to 20, 0 is off, and opacity.
ShadowBlur = 3
ShadowOpacity = 0.9

# Panel rows as "Tag: values"; an empty row is hidden. ExtraFans is a cell per ExtraFan.
# Values: CpuLoad, CpuTemp, CpuPower, CpuClock, SysMemory, CpuFan, AioFan, ExtraFans, GpuLoad, GpuTemp, GpuPower, GpuClock, GpuMemory, GpuFan, Fps, FrameTime
Row1 = CPU: CpuLoad, CpuTemp, CpuPower, CpuClock, SysMemory, CpuFan, AioFan, ExtraFans
Row2 = GPU: GpuLoad, GpuTemp, GpuPower, GpuClock, GpuMemory, GpuFan
Row3 = FPS: Fps, FrameTime

# Full-screen apps the panel is never shown over.
BlackListApplications = SnippingTool*, ScreenClippingHost, ShareX, Greenshot, Lightshot, LockApp, LogonUI, dwm, vlc, mpv, mpc-hc*, mpc-be*, PotPlayer*, wmplayer, Video.UI, Photos, Microsoft.Photos, chrome, msedge, firefox, brave, opera, vivaldi, POWERPNT, mstsc, HandBrake, Zoom, Teams, ms-teams, ktalk*, TrueConf

[Spinner]
Style = Loader
Effect = Original
InvertRotation = false

# Sun elevation, degrees: the lighting comes up below DimAbove, full below FullBelow.
DimAbove = 10
FullBelow = -6

[Aura]
# ARGB lighting that follows the sun: dark by day, up after sunset. Toggled in the menu.
Enable = false

# Colour of every LED, #RRGGBB or a name.
Color = #0078FF

# Solid, Breathing or Rainbow; Speed of the last two, 1 to 10.
Effect = Solid
Speed = 5

# Brightness after sunset.
Brightness = 100 %

# Below this brightness the LEDs are off.
VisibleFrom = 15 %

# Go dark earlier on cloudy evenings, by Open-Meteo.
WeatherCloud = true

# LEDs per addressable header, capped by the controller; ASRock keeps its own count.
LedsPerChannel = 300
