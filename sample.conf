[General]
# Interface language: Auto, En, Ru, Ar, Zh, Fr, De, It or Ja (Auto).
Language = Auto

# Poll interval, seconds (1). Less than one is refused.
UpdateInterval = 1

# Spin the tray icon while no full-screen application is running.
SpinOnDesktop = true

# Log the whole course of work, not only events, warnings and errors.
Debug = false

# Take the volume and brightness keys and show own OSD.
AlwaysUseCustomOsd = false

# Steps from zero to full for volume and brightness. With Alt held a key moves one per cent.
AdjustmentStepsOsd = 16

# Drive an external monitor over DDC/CI: its brightness, and its own speakers.
ControlExternalBrightness = true
ControlExternalVolume = true

# Keys standing in for the brightness keys a keyboard has not got (Ctrl+F1/F2).
BrightnessKeys = Ctrl+F1/F2

# Look up the external address through checkip.dyndns.org.
ShowExternalAddress = true

# Chart points and process rows in the status window.
DetailHistoryPoints = 500
DetailTopProcesses = 12

[Hardware]
# Which GPU when there are several (0). The discrete one comes first.
GpuIndex = 0

# CPU load.
CpuLoad = CPU Total

# CPU temperature and power.
CpuTemp = CPU Package, Core Max, CPU Cores, P-Core Max, Core (Tctl/Tdie), Core (Tctl), Core (Tdie), CCDs Max (Tdie), CCD1 (Tdie), Package
CpuPower = CPU Package, CPU Cores, Package, Core (SVI2 TFN), CPU SoC

# The clock is averaged over the cores whose sensor name holds this word.
CpuClockCores = P-Core

# Memory used and free — together they make the scale in the status window.
MemoryUsed = Memory Used
MemoryAvailable = Memory Available

# GPU: load, temperature, power, clock.
GpuLoad = GPU Core, D3D 3D
GpuTemp = GPU Core, GPU Hot Spot, GPU Temperature
GpuPower = GPU Package, GPU Power, GPU PPT
GpuClock = GPU Core, GPU Graphics

# Video memory used and total.
GpuMemory = D3D Dedicated Memory Used, GPU Memory Used, GPU Memory Dedicated Used
GpuMemoryTotal = GPU Memory Total, D3D Dedicated Memory Total

# Fan sensors, filled in on the first run. Clear all three lists to scan again.
CpuFan = 
AioFan = 
GpuFan = 

# Your own fans — one cell each, wherever ExtraFans stands in a row below.
ExtraFan = 

# Average the whole list instead of taking the first name found.
AverageCpuFan = false
AverageAioFan = false
AverageGpuFan = true

# Highlighting past a threshold; zero switches one off.
WarnColor = #FF6A52
WarnCpuTemp = 85
WarnGpuTemp = 83
WarnSysMem = 90 %
WarnGpuMem = 90 %
WarnSwapMem = 90 %
WarnCpuUsage = 95 %
WarnGpuUsage = 95 %

# Tint the Aura lighting towards a warning colour: Off; Heat, as WarnCpuTemp or
# WarnGpuTemp nears; Load, as WarnCpuUsage or WarnGpuUsage nears; Max, by whichever
# of the two is nearer (Heat).
WarnColorBy = Heat

[FullScreenOverlay]
# The panel over a game.
Enable = true

# Panel font — the first of these names present in the system.
FontFamily = Impact, Haettenschweiler, Arial Narrow, Arial

# Font size, per cent of the computed one (100), from 50 to 300.
FontScalePercent = 100

# Unit labels, per cent of the values (55).
UnitSizePercent = 55

# Offset from the top-left corner of the screen (10).
Margin = 10

# Text colour — #RRGGBB or a name such as White — and its opacity.
TextColor = #FFFFFF
TextOpacity = 0.85

# Dark backdrop behind the panel (off).
ShowPanel = false
PanelColor = #0B0D12
PanelOpacity = 0.45

# Shadow under the text (3 and 0.9), from 0 to 20. Zero switches it off.
ShadowBlur = 3
ShadowOpacity = 0.9

# Rows of the panel, in the order shown: the tag before the colon, the values after.
# An empty parameter removes a row; any value can stand in any row.
#   CpuLoad, CpuTemp, CpuPower, CpuClock, SysMemory, CpuFan, AioFan, ExtraFans
#   GpuLoad, GpuTemp, GpuPower, GpuClock, GpuMemory, GpuFan, Fps, FrameTime
# ExtraFans is one cell per name in ExtraFan above.
Row1 = CPU: CpuLoad, CpuTemp, CpuPower, CpuClock, SysMemory, CpuFan, AioFan, ExtraFans
Row2 = GPU: GpuLoad, GpuTemp, GpuPower, GpuClock, GpuMemory, GpuFan
Row3 = FPS: Fps, FrameTime

# Full-screen applications the panel is not shown over.
BlackListApplications = SnippingTool*, ScreenClippingHost, ShareX, Greenshot, Lightshot, LockApp, LogonUI, dwm, vlc, mpv, mpc-hc*, mpc-be*, PotPlayer*, wmplayer, Video.UI, Photos, Microsoft.Photos, chrome, msedge, firefox, brave, opera, vivaldi, POWERPNT, mstsc, HandBrake, Zoom, Teams, ms-teams, ktalk*, TrueConf

[Spinner]
Style = Loader
Effect = Original
InvertRotation = false

# Sun elevation in degrees for the Aura lighting: it comes up from DimAbove
# and is full below FullBelow.
DimAbove = 10
FullBelow = -6

[Aura]
# Motherboard lighting on a supported controller, dark by day and up after sunset.
# Switched from the Spinners menu, which offers it only when a controller is found.
# The sun span is that of [Spinner]; the place comes from the IP address and the system time zone.
Enable = false

# One colour for every LED — #RRGGBB or a name such as Orange.
Color = #0078FF

# Solid, Breathing or Rainbow, and the pace of the last two from 1 to 10 (5).
Effect = Solid
Speed = 5

# Brightness once the sun is below FullBelow (100 %).
Brightness = 100 %

# Lowest brightness the LEDs actually show; lower levels count as zero.
VisibleFrom = 15 %

# Cloud cover through Open-Meteo makes an overcast evening go dark earlier.
WeatherCloud = true

# LEDs on every addressable channel of the controller (300). Longer than a controller
# can address is lit up to its own limit — 120 on an Aura header.
LedsPerChannel = 300
