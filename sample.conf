# System-Spinner settings. Read once, at startup — restart after editing.

[General]
# Interface language: Auto, En, Ru, Ar, Zh, Fr, De, It or Ja (Auto).
Language = Auto

# Poll interval, seconds (1). Less than one is refused.
UpdateInterval = 1

# Show the panel over full-screen applications (true).
ShowOverlayInGames = true

# Spin the tray icon while no full-screen application is running (true).
SpinOnDesktop = true

# Log the whole course of work, not just problems (false).
# The first run — the one that creates this file — is always logged in full.
Debug = false

# Take the volume and brightness keys even when no monitor answers over DDC (false).
# Off, those keys are left to Windows whenever there is nothing to drive over DDC:
# it changes the volume or the brightness itself and shows its own panel, and a
# second panel of ours would only repeat it. On, the app takes the keys in every
# case and shows its own panel for them — the Windows one is then kept out of sight.
AlwaysUseCustomOsd = false

# Steps from zero to full for volume and brightness (16).
AdjustmentStepsOsd = 16

# Drive an external monitor over DDC/CI: its brightness, and its own speakers
# (both on). The monitor's volume is kept in step with the Windows mixer — both
# carry the same number, so one press is one step whichever of the two the sound
# is listened through.
ControlExternalBrightness = true
ControlExternalVolume = true

# Look up the external address through checkip.dyndns.org (true).
ShowExternalAddress = true

# Chart points and process rows in the status window (500 and 12).
DetailHistoryPoints = 500
DetailTopProcesses = 12

[Hardware]
# Sensor names the readings come from; the Intel and the AMD ones stand together.
# Change a name when its value shows a dash: what your machine reports goes to
# sensors-found.txt next to this file.

# Which GPU when there are several (0). The discrete one comes first.
GpuIndex = 0

# CPU load.
CpuLoad = CPU Total

# CPU temperature and power.
CpuTemp = CPU Package, Core Max, CPU Cores, P-Core Max, Core (Tctl/Tdie), Core (Tctl), Core (Tdie), CCDs Max (Tdie), CCD1 (Tdie), Package
CpuPower = CPU Package, CPU Cores, Package, Core (SVI2 TFN), CPU SoC

# The clock is averaged over the cores whose sensor name holds this word.
CpuClockCores = P-Core

# Memory used and free — together they make the scale in the status window.
MemoryUsed = Memory Used
MemoryAvailable = Memory Available

# GPU: load, temperature, power, clock.
GpuLoad = GPU Core, D3D 3D
GpuTemp = GPU Core, GPU Hot Spot, GPU Temperature
GpuPower = GPU Package, GPU Power, GPU PPT
GpuClock = GPU Core, GPU Graphics

# Video memory used and total.
GpuMemory = GPU Memory Used, D3D Dedicated Memory Used, GPU Memory Dedicated Used
GpuMemoryTotal = GPU Memory Total, D3D Dedicated Memory Total

# Fan sensors, filled in on the first run. Clear all three lists to scan again.
CpuFan = 
AioFan = 
GpuFan = 

# Your own fans — one cell each, wherever ExtraFans stands in a row below.
ExtraFan = 

# Average the whole list instead of taking the first name found.
AverageCpuFan = false
AverageAioFan = false
AverageGpuFan = true

# Highlighting past a threshold; zero switches one off.
WarnColor = #FF6A52
WarnCpuTemp = 85
WarnGpuTemp = 83
WarnSysMem = 90 %
WarnGpuMem = 90 %
WarnSwapMem = 90 %
WarnCpuUsage = 95 %
WarnGpuUsage = 95 %

[AppearanceFullScreen]
# The panel over a game; the tray icon and the status window follow the system theme.

# Panel font — the first of these names present in the system.
FontFamily = Impact, Haettenschweiler, Arial Narrow, Arial

# Font size, per cent of the computed one (100), from 50 to 300.
FontScalePercent = 100

# Unit labels, per cent of the values (55).
UnitSizePercent = 55

# Offset from the top-left corner of the screen (10).
Margin = 10

# Text colour — #RRGGBB or a name such as White — and its opacity.
TextColor = #FFFFFF
TextOpacity = 0.85

# Dark backdrop behind the panel (off).
ShowPanel = false
PanelColor = #0B0D12
PanelOpacity = 0.45

# Shadow under the text (3 and 0.9), from 0 to 20. Zero switches it off.
ShadowBlur = 3
ShadowOpacity = 0.9

# Rows of the panel, in the order shown: the tag before the colon, the values after.
# An empty parameter removes a row; any value can stand in any row.
#   CpuLoad, CpuTemp, CpuPower, CpuClock, SysMemory, CpuFan, AioFan, ExtraFans
#   GpuLoad, GpuTemp, GpuPower, GpuClock, GpuMemory, GpuFan, Fps, FrameTime
# ExtraFans is one cell per name in ExtraFan above.
Row1 = CPU: CpuLoad, CpuTemp, CpuPower, CpuClock, SysMemory, CpuFan, AioFan, ExtraFans
Row2 = GPU: GpuLoad, GpuTemp, GpuPower, GpuClock, GpuMemory, GpuFan
Row3 = FPS: Fps, FrameTime

[Spinner]
# The tray icon outside full-screen applications; its speed follows the busier of
# the processor and the card.
# A set of one frame — App Icon, say — simply stands still.
#   App Icon, Blue Ball, Cat, Circles Two, Cirrcles, Color Balls, Color Well, Delay, Dots, Grey Loader, Loader, Pie, Pikachu, Rainbow Pie, Recharges, Rotation Color Well, Sun, Waves
Style = Loader

# Colouring: Original, White, Black or Auto (Original). Sets that live by their own
# colours ignore it.
Effect = Original

# Spin the frames backwards (false).
InvertRotation = false
