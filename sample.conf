# System Spinner x64 settings.
#
# Lines starting with a hash are comments. Removing a parameter is safe: the
# default then applies, shown in parentheses.
#
# Lists are comma-separated and tried in order — the first one present in the
# system wins.

[General]
# Language of the application: Auto, En, Ru, Ar, Zh, Fr, De, It or Ja (Auto).
# Auto follows the system language and falls back to English.
# This file and the log are always in English.
Language = Auto

# Update interval for the data and the sensors, seconds (1, 1.5, 2, 3).
# Below one second it is not accepted: polling wakes the driver, and the app must
# not eat what it measures.
UpdateInterval = 1

# Show the overlay while the active window covers the whole screen (true).
# false leaves only the tray icon — that is, the spinner half of the app alone.
# The full-screen test is loose: a video player counts as well.
ShowOverlayInGames = true

# Keep the tray icon spinning outside full-screen applications (true). false
# leaves the first frame standing still until a game starts: the animation is
# cheap, but on a laptop every wake-up costs battery.
SpinOnDesktop = true

# What to write to SystemSpinnerX64.log next to this file: Info, Warn or Error
# (Warn). Reasons for a refused startup are always written, whatever this is set
# to. With the parameter absent the whole run is logged as Info — as on the first
# start.
LogLevel = Warn

# Always show the custom OSD when brightness or volume changes (false). Otherwise,
# when there is nothing to control, the key is handed back to Windows and it draws
# its own panel.
AlwaysUseCustomOsd = false

# How many steps the OSD scale is divided into (8, 16, 24, 32). One key press is
# one step, and the ticks under the bar show exactly this number.
AdjustmentStepsOsd = 16

# Key combinations for brightness. Windows has no brightness keys of its own: on
# laptops the firmware handles them and they never reach an application, so an
# ordinary combination is used instead. The defaults mirror the Mac layout —
# F1 down, F2 up. Write off to give brightness back to the system.
# Format: Ctrl+Alt+F2, Win+Shift+Up, Ctrl+PageUp.
BrightnessUpKey = Ctrl+Alt+F2
BrightnessDownKey = Ctrl+Alt+F1

# Look up the external address through checkip.dyndns.org (true). This is the only
# request the app makes to the network; turning it off leaves the local address.
ShowExternalAddress = true

# How much history the charts keep and how many processes the list shows.
# 900 points at a one-second interval is a quarter of an hour.
DetailHistoryPoints = 900
DetailTopProcesses = 12

[Hardware]
# Names of the sensors the readings come from. You need to change them when some
# values show a dash: the naming depends on the hardware and the library version.
# The app writes the full list visible on your machine to the log at
# LogLevel = Info, and to sensors-found.txt next to this file.
#
# The CPU names are the Intel ones: this build targets Intel processors, and startup
# stops with an explanation on anything else. The GPU names are shared — Intel,
# NVIDIA and AMD all report load, temperature and clock the same way.

# Which GPU to show when there are several (0). The discrete one comes first.
GpuIndex = 0

# CPU load. CPU Total is the average over all threads: on a 24-thread CPU a game
# using eight threads shows about 15 %. CPU Core Max is the busiest core, closer
# to what in-game overlays report. This value also drives the spinner speed.
CpuLoad = CPU Total

# CPU temperature and power.
CpuTemp = CPU Package, Core Max, CPU Cores, P-Core Max, Package
CpuPower = CPU Package, CPU Cores, Package

# CPU clock — averaged over the cores whose sensor name holds this word. Efficient
# cores are left out: they run at their own, lower clock and would drag it down.
CpuClockCores = P-Core

# Memory. Used goes on the overlay; the free part only feeds the status window,
# where the two together make the scale: how much of the installed memory is taken.
MemoryUsed = Memory Used
MemoryAvailable = Memory Available

# GPU: load, temperature, power, clock.
GpuLoad = GPU Core, D3D 3D
GpuTemp = GPU Core, GPU Hot Spot, GPU Temperature
GpuPower = GPU Package, GPU Power, GPU PPT
GpuClock = GPU Core, GPU Graphics

# Video memory. GPU Memory Used is what the whole card holds; put
# D3D Dedicated Memory Used first if you only want what the game itself takes.
# The total is only used by the status window: without it the megabytes have
# nothing to be compared against, and a scale without a ceiling is meaningless.
GpuMemory = GPU Memory Used, D3D Dedicated Memory Used, GPU Memory Dedicated Used
GpuMemoryTotal = GPU Memory Total, D3D Dedicated Memory Total

# Names of the fan sensors. They fill in by themselves on the first run: every
# board names its headers differently, so they cannot be guessed in advance. While
# all three lists are empty the app rescans the hardware; once the file has
# something, it uses that. To force a rescan, clear the three lists below and
# start the app again.

# The CPU cooler, followed by case fans as fallbacks.
CpuFan = 

# The AIO pump. Empty means the cell is not shown at all: a dash would say «the
# sensor is silent», while an air cooler simply has no pump. Auto-detection never
# fills this in, but nothing stops you from typing a name yourself.
AioFan = 

# GPU fans.
GpuFan = 

# Your own fans — one extra cell per name, at the end of the CPU row. This is where
# case fans, the PSU fan or a second pump header go. Auto-detection never touches
# this list, and a rescan does not overwrite it.
ExtraFan = 

# Show the average over every name in the list instead of the first one found.
# Without the flag the list is an order of preference; with it, a group to merge.
# Enabled for the GPU: it has two or three fans but only one cell.
AverageCpuFan = false
AverageAioFan = false
AverageGpuFan = true

# Highlighting for values past a threshold. Zero disables a threshold, so you can
# keep temperatures only. One colour serves them all: the point of the highlight is
# to catch the eye, and one difference from the rest is enough.
WarnColor = #FF6A52

# Temperatures, °C (85 and 83). They colour the values on the overlay and the
# temperature scales in the status window.
WarnCpuTemp = 85
WarnGpuTemp = 83

# Memory, per cent of the total (90 % each). These colour the three memory scales in
# the status window: the installed memory, the video memory and the page file.
WarnSysMem = 90 %
WarnGpuMem = 90 %
WarnSwap = 90 %

[AppearanceFullScreen]
# How the overlay looks. Nothing here touches the tray icon or the status window:
# those follow the system theme, and a game has no theme to follow.

# Panel font. Several comma-separated names — the first one present in the system
# is used. Impact is chosen for density: a long row of values fits over the game.
FontFamily = Impact, Haettenschweiler, Arial Narrow, Arial

# Font size as a percentage of the computed one (100), from 50 to 300. The size
# does not depend on the resolution: Windows scaling is already accounted for.
FontScalePercent = 100

# Size of the unit labels (%, °C, RPM) as a percentage of the values (55).
UnitSizePercent = 55

# Panel offset from the top-left corner of the screen (10).
Margin = 10

# Colour and opacity of the text. The colour is #RRGGBB or a name such as White,
# Gold, LightGreen. Values, labels and row tags share one colour and differ only in
# opacity: a multicoloured panel over a game reads worse than one colour at
# several densities.
TextColor = #FFFFFF
TextOpacity = 0.85

# Dark backdrop behind the panel (off). Over a game it reads as a rectangle across
# the picture, so it is off by default. Worth enabling on a busy background.
ShowPanel = false
PanelColor = #0B0D12
PanelOpacity = 0.45

[Spinner]
# The tray icon outside full-screen applications. Its speed is the whole way this
# app shows CPU load: the busier the processor, the faster the animation runs.
# Every set is also in the tray menu, and picking one there writes it here.

# Name of the frame set (Loader). Available sets:
#   Blue Ball, Cat, Circles Two, Cirrcles, Color Balls, Color Well, Delay, Dots, Grey Loader, Loader, Pie, Pikachu, Rainbow Pie, Recharges, Rotation Color Well, Sun, Waves
Style = Loader

# Colouring: Original, White, Black or Auto (Original). Auto follows the taskbar
# theme — black on a light taskbar, white on a dark one. Sets that live by their
# own colours ignore this: a silhouette would turn them into a blob.
Effect = Original

# Spin the frames backwards (false).
#
# The exact number is in the tooltip under the pointer: the speed of the animation
# shows the load at a glance, and hovering shows the digits.
InvertRotation = false
